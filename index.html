<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="game-info">
            <p id="status">Player X's Turn</p>
            <button id="restart-btn" onclick="restartGame()">New Game</button>
        </div>
        <div class="board" id="board">
            <div class="square" onclick="handleSquareClick(0)"></div>
            <div class="square" onclick="handleSquareClick(1)"></div>
            <div class="square" onclick="handleSquareClick(2)"></div>
            <div class="square" onclick="handleSquareClick(3)"></div>
            <div class="square" onclick="handleSquareClick(4)"></div>
            <div class="square" onclick="handleSquareClick(5)"></div>
            <div class="square" onclick="handleSquareClick(6)"></div>
            <div class="square" onclick="handleSquareClick(7)"></div>
            <div class="square" onclick="handleSquareClick(8)"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
